[package]
name = "metaverse_avatar"
version = "0.2.0"
authors = ["Skyler Clark<skylerjaneclark@gmail.com>"]
description = "Avatar handling for the open metaverse"
license = "AGPL-3.0-or-later"
edition = "2024"



[dependencies]
metaverse_messages = {path="../messages/"}
default_asset_converter = {path = "../default_asset_converter"}
benthic_protocol = {path = "../benthic_protocol/"}
metaverse_mesh = {path = "../../../metaverse_mesh/"}
byteorder = "1.5.0"
rgb = "0.8.53"
uuid = "1.26.1"
glam = "0.32.1"
log = "0.4.34"
indexmap = "2.14.2"
serde_json = "1.0.151"
actix = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
strum = "0.28"
strum_macros = "0.28"
thiserror = "2.0.20"

