[package]
name = "benthic_ui"
version = "0.2.0"
authors = ["Skyler Clark<skylerjaneclark@gmail.com>"]
description = "Bevy UI plugin for open metaverse clients"
license = "AGPL-3.0-or-later"
edition = "2024"
resolver = "2"
build = "build.rs"

[build-dependencies]
benthic_default_assets = {path="../../../benthic_default_assets/"}

[dependencies]
metaverse_core = {path="../core"}
benthic_default_assets = {path="../../../benthic_default_assets/"}
benthic_protocol = {path="../../../benthic_protocol/"}
metaverse_agent = {path="../agent"}

#disable sound for bevy
bevy = { version = "0.19", default-features = false, features = [
    "bevy_animation",
    "bevy_winit",
    "bevy_render",
    "bevy_scene",
    "bevy_pbr",
    "bevy_ui",
    "bevy_text",
    "bevy_state",
    "bevy_picking",
    "bevy_window",
    "bevy_core_pipeline",
    "multi_threaded",
    "bevy_log",
    "tonemapping_luts",
    "dynamic_linking",
    "zstd_rust",
    "png",
    "jpeg"
]}
bevy_gltf = { version = "0.19", features = ["bevy_animation"] }
bevy_egui = "0.42.0"
bevy_panorbit_camera = "0.35.1"
egui = "0.36.2"
tokio = { version = "1", features = ["full"] }
actix-rt = "2.13.0"
accesskit = "0.25.0"
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5.17"
serde_json = "1.0"
portpicker = "0.1.1"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
dirs = "7.0.0"
log = "0.4.34"
thiserror = "2.0.20"
bevy_heightmap = "0.19.0"
bevy_post_process = "0.19.1"
bevy_world_serialization = "0.19.1"
[dependencies.uuid]
version = "1.26.1"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]
