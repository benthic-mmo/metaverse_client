[package]
name = "benthic_ui"
version = "0.3.3"
authors = ["Skyler Clark<skylerjaneclark@gmail.com>"]
description = "Bevy UI plugin for open metaverse clients"
license = "AGPL-3.0-or-later"
homepage= "https://benthic-mmo.github.io/"
repository = "https://github.com/benthic-mmo/metaverse_client/tree/main/crates/ui"
edition = "2024"
resolver = "2"
build = "build.rs"

[build-dependencies]
benthic_default_asset_converter.workspace = true 

[dependencies]
metaverse_core.workspace = true 
benthic_default_asset_converter.workspace = true 
benthic_protocol.workspace = true 
metaverse_avatar.workspace = true 

#disable sound for bevy
bevy = { version="0.19.0", default-features = false, features = [
    "bevy_animation",
    "bevy_winit",
    "bevy_gltf",
    "bevy_render",
    "bevy_scene",
    "bevy_pbr",
    "bevy_ui",
    "bevy_text",
    "bevy_state",
    "bevy_picking",
    "bevy_window",
    "bevy_core_pipeline",
    "multi_threaded",
    "bevy_log",
    "tonemapping_luts",
    "dynamic_linking",
    "zstd_rust",
    "png",
    "jpeg"
]}
accesskit = "0.25.0"
bevy_heightmap = "0.19.0"
bevy_post_process = "0.19.1"
bevy_world_serialization = "0.19.1"
bevy-inspector-egui = "0.37.0"
bevy_gizmos = "0.19.1"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
egui = "0.36.2"
bevy_gltf = { version = "0.19", features = ["bevy_animation"] }
bevy_egui = "0.42.0"

actix-rt.workspace = true 
bevy_panorbit_camera = {workspace=true, features=["bevy_egui"]}
tokio = { workspace=true, features = ["full"] }
serde.workspace = true 
crossbeam-channel.workspace = true 
serde_json.workspace = true 
portpicker.workspace = true 
dirs.workspace = true 
log.workspace = true 
thiserror.workspace = true 
[dependencies.uuid]
workspace = true 
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]
