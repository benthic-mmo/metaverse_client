
[workspace]
resolver = "2"
members = [
	"crates/core",
	"crates/messages",
  "crates/ui", 
  "crates/environment", 
  "crates/avatar", 
  "crates/cache", 
  "crates/objects",
  "crates/benthic_protocol",
  "crates/default_asset_converter",
]

[workspace.dependencies]
metaverse_mesh = {version = "0.3.2", path = "../metaverse_mesh/"}
metaverse_messages = {version = "0.3.2", path = "./crates/messages"}
metaverse_cache = {version = "0.3.2", path = "./crates/cache"}
metaverse_core = {version = "0.3.2", path = "./crates/core"}
metaverse_objects = {version = "0.3.2", path = "./crates/objects"}
metaverse_avatar = { version = "0.3.2", path = "./crates/avatar/"} 
metaverse_environment = { version = "0.3.2", path = "./crates/environment/"} 
benthic_protocol = { version = "0.3.2", path = "./crates/benthic_protocol" }
benthic_default_asset_converter = { version = "0.3.2", path = "./crates/default_asset_converter" }

serde-llsd-benthic = "0.3.2"
uuid = "1.26.1"
glam = "0.32.1"
indexmap = "2.14.2"
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
actix = "0.13.5"
thiserror = "2.0.20"
log = "0.4.34"
rgb = "0.8.53"
anyhow = "1.0.102"
awc = "3.8.2"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = "1.53.1"
sqlx = {version="0.9.0", features=["runtime-tokio"]}
bevy = "0.19.0"
bevy_world_serialization = "0.19.0"
bevy_panorbit_camera = "0.35.0"
lazy_static = "1.5.0"
gltf = "1.4.1"
gltf-json = "1.4.1"
once_cell = "1.21.4"
image = "0.25.10"
jpeg2k = "0.10.1"
bytemuck = "1.25.2"
byteorder = "1.5.0"
quick-xml = "0.42.0"
bincode ="2.0.1"
actix-rt = "2.13.0"
crossbeam-channel = "0.5.17"
portpicker = "0.1.1"
dirs = "7.0.0"
bytes = "1.12.1"
url = "2.5.8"
actix-http = "3.13.5"
